#baseurl: /seek

remote_theme: ELIXIR-Belgium/elixir-toolkit-theme@2.3.0

current_seek_version: "1.15.1"
current_docker_tag: "1.15"

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed

name: FAIRDOM
url: https://help.datahub-test.elixir-belgium.org
author: FAIRDOM

title: "FAIRDOM-SEEK Docs"
topnav_title: ""


exclude:
 - Gemfile*
 - .gitignore

defaults:
